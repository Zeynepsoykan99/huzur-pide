<!DOCTYPE html>
<html lang="tr" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#F5EFE6">
  <meta name="description" content="Huzur Pide dijital menü — dil seçimi">
  <title>Huzur Pide</title>

  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">

  <!-- Baslik fontu: Marcellus (serif, display). Gövde metni sistem fontlarina birakildi. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Marcellus&display=swap" rel="stylesheet">

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      // Dokunmatik ekranlarda hover durumunun dokunustan sonra
      // ekranda "yapisip" kalmasini engeller.
      future: { hoverOnlyWhenSupported: true },
      theme: {
        extend: {
          colors: {
            cream: { 50: '#F5EFE6', 100: '#EDE0D4', 200: '#E0CDB8' },
            latte: { 400: '#C8A27A', 500: '#B08968', 600: '#96745A' },
            cocoa: { 700: '#6B5342', 900: '#4A3728' },
          },
          fontFamily: {
            display: ['Marcellus', 'Georgia', 'Cambria', 'serif'],
            body: ['system-ui', '-apple-system', 'Segoe UI', 'Roboto', 'Helvetica Neue', 'Arial', 'sans-serif'],
          },
        },
      },
    };
  </script>
  <style type="text/tailwindcss">
    @layer components {

      /* Dil butonu.
         Yon bagimli hicbir utility yok (px, gap, text-start) — dir="rtl"
         verildiginde satir kendiliginden aynalanir. */
      .lang-btn {
        @apply flex min-h-[3.5rem] w-full items-center gap-4 rounded-2xl
               bg-latte-400 px-4 py-3.5 text-start
               shadow-md shadow-cocoa-900/10
               ring-1 ring-latte-600/25
               outline-none transition duration-200 ease-out
               hover:-translate-y-0.5 hover:bg-latte-500 hover:shadow-lg hover:shadow-cocoa-900/20
               active:translate-y-0 active:bg-latte-600 active:shadow-sm active:duration-75
               focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-[3px]
               focus-visible:outline-cocoa-900;
      }

      /* Bayraklarin en-boy orani birbirinden farkli (tr 3:2, gb 1:2,
         ae 2:1, ru 3:2). Sabit genislikte bir slot, hepsini ayni yere
         oturtup metinlerin hizasini korur. */
      .flag-slot {
        @apply flex w-12 shrink-0 items-center justify-center;
      }

      /* Ince kenarlik: RU/GB/AE bayraklarindaki beyaz alanlar sutlu
         kahve zeminde kaybolmasin diye. */
      .flag {
        @apply h-6 w-auto max-w-full rounded-[3px]
               ring-1 ring-cocoa-900/25 shadow-sm shadow-cocoa-900/20;
      }

      .lang-name {
        @apply flex-1 text-lg font-semibold leading-tight text-cocoa-900 sm:text-xl;
      }

      /* Arap alfabesi ayni punto degerinde latin harflerden kucuk
         gorunur; bu yuzden biraz buyutulur. */
      .lang-name[lang="ar"] {
        @apply text-xl leading-snug sm:text-2xl;
      }

      .lang-arrow {
        @apply h-5 w-5 shrink-0 text-cocoa-900/45
               transition-transform duration-200 ease-out;
      }

      .lang-btn:hover .lang-arrow {
        @apply translate-x-1 text-cocoa-900/70;
      }
    }
  </style>

  <link rel="stylesheet" href="assets/css/custom.css">
</head>

<body class="min-h-dvh bg-cream-50 bg-gradient-to-b from-cream-50 to-cream-100 font-body text-cocoa-900 antialiased">

  <!--
    Sayfa iskeleti. Yon bagimli tum bosluklar logical property (ms/me/ps/pe,
    text-start) ile yazilir; boylece <html dir="rtl"> yapildiginda duzen
    kendiliginden aynalanir.
  -->
  <div class="mx-auto flex min-h-dvh w-full max-w-md flex-col px-6 py-10 sm:max-w-lg sm:py-14 lg:max-w-xl">

    <!-- Header + dil secimi: dikeyde ortalanir, footer altta kalir -->
    <div class="flex flex-1 flex-col justify-center py-2">

    <!-- Logo / baslik alani -->
    <header class="flex flex-col items-center text-center">
      <img src="assets/logo.svg" alt="" aria-hidden="true"
           class="h-16 w-16 sm:h-20 sm:w-20" width="80" height="80">

      <h1 class="mt-5 font-display text-4xl leading-none tracking-wide text-cocoa-900 sm:text-5xl">
        Huzur Pide
      </h1>

      <!-- Ince ayrac: iki cizgi arasinda kucuk bir elmas -->
      <div class="mt-4 flex w-full max-w-[13rem] items-center gap-3" aria-hidden="true">
        <span class="h-px flex-1 bg-gradient-to-r from-transparent to-latte-400"></span>
        <span class="h-1.5 w-1.5 rotate-45 bg-latte-500"></span>
        <span class="h-px flex-1 bg-gradient-to-l from-transparent to-latte-400"></span>
      </div>

      <p class="mt-4 text-sm text-cocoa-700 sm:text-base">
        Fırından sofranıza
      </p>
    </header>

    <!-- Dil secimi. Butonlar Adim 4'te eklenecek. -->
    <main class="mt-10 sm:mt-12">
      <h2 class="text-center text-xs font-semibold uppercase tracking-[0.18em] text-cocoa-700">
        Dil Seçiniz
      </h2>
      <p class="mt-1.5 text-center text-xs text-cocoa-700/70">
        <span lang="en">Choose language</span>
        <span aria-hidden="true" class="mx-1.5 text-latte-500">·</span>
        <span lang="ar" dir="rtl">اختر اللغة</span>
        <span aria-hidden="true" class="mx-1.5 text-latte-500">·</span>
        <span lang="ru">Выберите язык</span>
      </p>

      <!--
        Dil butonlari.
        - data-lang / data-dir: Asama 3'te JS'in tutunacagi kancalar.
        - Yon bagimli hicbir sinif yok (ml/mr/left/right yerine ms/me ve
          text-start), bu yuzden <html dir="rtl"> yapildiginda satir
          kendiliginden aynalanir: bayrak saga, ok sola gecer.
      -->
      <div id="language-list"
           class="mt-6 grid grid-cols-1 gap-3 md:grid-cols-2 md:gap-4">

        <button type="button" data-lang="tr" data-dir="ltr" class="lang-btn">
          <span class="flag-slot">
            <img src="assets/flags/tr.svg" alt="" aria-hidden="true" class="flag">
          </span>
          <span class="lang-name" lang="tr">Türkçe</span>
          <svg class="lang-arrow" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M9 5l7 7-7 7" stroke="currentColor" stroke-width="2"
                  stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>

        <button type="button" data-lang="en" data-dir="ltr" class="lang-btn">
          <span class="flag-slot">
            <img src="assets/flags/gb.svg" alt="" aria-hidden="true" class="flag">
          </span>
          <span class="lang-name" lang="en">English</span>
          <svg class="lang-arrow" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M9 5l7 7-7 7" stroke="currentColor" stroke-width="2"
                  stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>

        <button type="button" data-lang="ar" data-dir="rtl" class="lang-btn">
          <span class="flag-slot">
            <img src="assets/flags/ae.svg" alt="" aria-hidden="true" class="flag">
          </span>
          <span class="lang-name" lang="ar">العربية</span>
          <svg class="lang-arrow" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M9 5l7 7-7 7" stroke="currentColor" stroke-width="2"
                  stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>

        <button type="button" data-lang="ru" data-dir="ltr" class="lang-btn">
          <span class="flag-slot">
            <img src="assets/flags/ru.svg" alt="" aria-hidden="true" class="flag">
          </span>
          <span class="lang-name" lang="ru">Русский</span>
          <svg class="lang-arrow" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M9 5l7 7-7 7" stroke="currentColor" stroke-width="2"
                  stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>

      </div>
    </main>

    </div>

    <footer class="mt-10 pt-6 text-center text-xs text-cocoa-700/60">
      <p>Huzur Pide · Dijital Menü</p>
    </footer>

  </div>

</body>
</html>
